---
version: "3"
services:
  letsencrypt:
    image: linuxserver/letsencrypt:latest
    container_name: letsencrypt
    ports:
      - 80:80
      - 443:443
    volumes:
      - /mnt/appdata/letsencrypt:/config
    restart:
      always
    depends_on:
      - plex
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - SUBDOMAINS=pi,plex,portainer
      - ONLY_SUBDOMAINS=true
      - DHLEVEL=2048
      - VALIDATION=http
      - TZ=America/Chicago
    env_file:
      - general.env
  plex:
    image: linuxserver/plex:latest
    container_name: plex
    network_mode: host
    ports:
      - 32400:32400
    volumes:
      - /mnt/appdata/plex:/config
      - /mnt/plex/movies:/data/movies
      - /mnt/plex/tvshows:/data/tvshows
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=latest
  portainer:
    image: portainer/portainer:linux-arm-1.23.0
    container_name: portainer
    ports:
      - 9000:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/appdata/portainer:/data
    restart: always
